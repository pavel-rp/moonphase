# pnpm 12 fails install on unreviewed dependency build scripts. None are needed here
# (prebuilt platform binaries ship as optional deps; CI already installs with
# --ignore-scripts), so they are explicitly denied, as ignoredBuiltDependencies did.
allowBuilds:
  "@tailwindcss/oxide": false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false

# Moved from package.json#pnpm.overrides: pnpm 11+ no longer reads the "pnpm" field.
overrides:
  "@types/react": "19.2.7"
  "@types/react-dom": "19.2.3"
  "esbuild@<=0.24.2": ">=0.25.0"
  "@eslint/plugin-kit@<0.3.4": ">=0.3.4"
  "vite@<=5.4.20": ">=5.4.21"
  vite: "^5.4.21"
  "js-yaml@<3.14.2": ">=3.14.2"
  "js-yaml@>=4.0.0 <4.1.1": ">=4.1.1"
  js-yaml: "^4.1.1"
  "glob@>=10.2.0 <10.5.0": ">=10.5.0"
